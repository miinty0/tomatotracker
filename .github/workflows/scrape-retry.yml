name: Retry Scraper

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check retry list
        id: check
        run: |
          if [ -f retry_list.json ]; then
            COUNT=$(python3 -c "import json; data=json.load(open('retry_list.json')); print(len(data))")
            echo "count=$COUNT" >> $GITHUB_OUTPUT
          else
            echo "count=0" >> $GITHUB_OUTPUT
          fi

      - name: Skip if retry list empty
        if: steps.check.outputs.count == '0'
        run: echo "retry_list.json is empty — skipping."

      - name: Install dependencies
        if: steps.check.outputs.count != '0'
        run: pip install requests beautifulsoup4 --break-system-packages

      - name: Run retry scraper
        if: steps.check.outputs.count != '0'
        run: |
          echo "Retrying ${{ steps.check.outputs.count }} book(s) from retry_list.json..."
          python3 scripts/scraper.py --mode retry

      - name: Commit updated data
        if: steps.check.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add waiting_list.json uploading_list.json retry_list.json
          git diff --staged --quiet || git commit -m "chore: scrape [retry] $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git push && break || sleep 15; done
