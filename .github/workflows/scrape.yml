name: Daily Scraper

on:
  schedule:
    # GitHub schedules are UTC. These are 03:17, 04:17, 07:17, 11:17,
    # 12:17, 15:17, 19:17 and 20:17 in Asia/Ho_Chi_Minh (UTC+7).
    # Using :17 avoids the high-load start-of-hour window.
    - cron: '17 20 * * *'  # 03:17 ICT — ongoing
    - cron: '17 21 * * *'  # 04:17 ICT — retry-only
    - cron: '17 0 * * *'   # 07:17 ICT — retry-only
    - cron: '17 4 * * *'   # 11:17 ICT — completed
    - cron: '17 5 * * *'   # 12:17 ICT — retry-only
    - cron: '17 8 * * *'   # 15:17 ICT — retry-only
    - cron: '17 12 * * *'  # 19:17 ICT — paused
    - cron: '17 13 * * *'  # 20:17 ICT — retry-only
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scrape mode'
        required: true
        type: choice
        options:
          - auto
          - completed
          - paused
          - new-only
          - retry-only
        default: auto

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (scripts)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout data branch (json files)
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - name: Install dependencies
        run: pip install requests beautifulsoup4 --break-system-packages

      - name: Determine run flags
        id: flags
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            case "${{ github.event.schedule }}" in
              '17 20 * * *') MODE="auto" ;;
              '17 21 * * *') MODE="retry-only" ;;
              '17 0 * * *')  MODE="retry-only" ;;
              '17 4 * * *')  MODE="completed" ;;
              '17 5 * * *')  MODE="retry-only" ;;
              '17 8 * * *')  MODE="retry-only" ;;
              '17 12 * * *') MODE="paused" ;;
              '17 13 * * *') MODE="retry-only" ;;
              *)
                echo "::error::Unknown scheduled cron: ${{ github.event.schedule }}"
                exit 1
                ;;
            esac
          else
            MODE="${{ github.event.inputs.mode || 'auto' }}"
          fi

          if [[ "$MODE" == "retry-only" ]]; then
            echo "args=--retry-only" >> $GITHUB_OUTPUT
            echo "label=retry-only" >> $GITHUB_OUTPUT
          else
            echo "args=--mode $MODE" >> $GITHUB_OUTPUT
            echo "label=$MODE" >> $GITHUB_OUTPUT
          fi

      - name: Run scraper
        working-directory: data
        run: python3 ../main/scripts/scraper.py ${{ steps.flags.outputs.args }}

      - name: Commit updated data to data branch
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add waiting_list.json uploading_list.json retry_list.json
          git diff --staged --quiet || git commit -m "chore: scrape [${{ steps.flags.outputs.label }}] $(TZ='Asia/Ho_Chi_Minh' date +'%Y-%m-%d %H:%M ICT')"
          pushed=false
          for i in 1 2 3; do
            if git push; then
              pushed=true
              break
            fi
            echo "push rejected (attempt $i/3), fetching + rebasing onto latest data branch..."
            git fetch origin data
            if ! git rebase origin/data; then
              echo "::warning::True conflict on attempt $i (same field touched within seconds by both scraper and web UI) — this is rare. Discarding this run's scrape commit to avoid corrupting user data; the next scheduled run will pick these books up again via retry_list.json / normal scrape."
              git rebase --abort
              break
            fi
            sleep 5
          done

          if [ "$pushed" = false ]; then
            echo "::error::Could not push scrape results this run (conflict with concurrent web UI edit). No data was corrupted — this run's scrape results were simply discarded; next scheduled run will retry."
            exit 1
          fi
